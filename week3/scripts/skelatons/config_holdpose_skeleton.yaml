# config_holdpose_skeleton.yaml: ส่วนที่ต้องเพิ่มใน config.yaml ของ "สำเนา" (งาน 3.7)
# ไฟล์ปลายทาง: ~/g1_study/week3/deploy/robots/g1_23dof/config/config.yaml
# แก้ config.yaml ไม่ต้อง build ใหม่ แต่ต้องเปิด g1_ctrl ใหม่ (ค่าถูกอ่านตอนเริ่มโปรแกรม)
#
# มี 3 จุด (ดูของเดิมของ Passive / FixStand / Handover เป็นแบบ):

# ── จุดที่ 1: ใน FSM: _: (state ที่เปิดใช้) ─────────────────────────────
#   เพิ่มบรรทัดนี้ "ใต้" Passive (ห้ามขึ้นเป็นบรรทัดแรก: state แรก = states[0] = state เริ่มต้น)
#
#     HoldPose:
#       id: 5            # TODO [3.7] เลขที่ยังไม่มีใครใช้ (ดู id ของ state อื่น)
#
#   คำถาม: ไม่ต้องใส่ type: ... เพราะอะไร (ดู Velocity ที่มี type: RLBase)

# ── จุดที่ 2: ใน FSM: Passive: transitions: ──────────────────────────────
#   ปุ่มรีโมทสำหรับเข้า HoldPose (คีย์ 'o' ของ sim เพิ่มใน main.cpp แยกต่างหาก)
#
#     HoldPose: LT + down.on_pressed      # TODO [3.7] เลือกปุ่มเองได้ แต่ต้องไม่ชนกับของเดิม
#
#   คำถาม: เงื่อนไขของ Passive จะถูกเช็คเรียงยังไง (std::map เรียงตามชื่อปลายทาง: FixStand < Handover < HoldPose)

# ── จุดที่ 3: บล็อกใหม่ใต้ FSM: (ระดับเดียวกับ Passive:, FixStand:) ────────
FSM:
  HoldPose:
    transitions:
      Passive: LT + B.on_pressed          # ทางออกฉุกเฉินเหมือนทุก state
    # TODO [3.7 H4/H5] 29 ค่า เรียงตาม slot 0..28 (6 ขาซ้าย, 6 ขาขวา, 3 เอว, 7 แขนซ้าย, 7 แขนขวา)
    #   แนะนำ gain ตอนเทรน: hip pitch/yaw + เอว 40.2/2.6 · hip roll + เข่า 99.1/6.3 · ข้อเท้า 28.5/1.8 · แขน 14.3/0.9
    #   slot ที่ไม่มีข้อต่อ (13,14,20,21,27,28) ใส่ 0
    #   ถ้าปล่อยเป็น [] (ค่าตอนนี้): state ทำงานได้แต่ไม่ตั้ง gain เลย → ใช้ค่าค้างจาก Passive (kp 0) = ยังหนืดเหมือนเดิม
    kp: []
    kd: []

# (ไฟล์นี้เป็น YAML ที่ถูกต้อง แต่ไม่ได้ถูกโหลดที่ไหน ให้ก็อปเฉพาะส่วนไปใส่ config.yaml เอง ระวัง indent 2 ช่อง)
